spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trading?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: D:/upload/

jwt:
  # Set JWT_SECRET in the environment; never commit a real signing key.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

llm:
  # OpenAI-compatible endpoint, e.g. https://api.openai.com/v1
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}